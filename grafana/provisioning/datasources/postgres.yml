apiVersion: 1

datasources:
  - name: PostgreSQL
    type: grafana-postgresql-datasource
    uid: postgres
    access: proxy
    url: $__env{GF_DB_HOST}
    user: $__env{GF_DB_USER}
    secureJsonData:
      password: $__env{GF_DB_PASSWORD}
    jsonData:
      database: $__env{GF_DB_NAME}
      sslmode: $__env{GF_DB_SSLMODE}
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true
