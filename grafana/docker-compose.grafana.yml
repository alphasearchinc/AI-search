version: "3.9"

services:
  grafana:
    image: ghcr.io/alphasearchinc/medusa-grafana:latest
    container_name: medusa-grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - loki
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - grafana_net

  loki:
    image: grafana/loki:2.9.8
    container_name: grafana-loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./loki-config.yml:/etc/loki/config.yml:ro
    networks:
      - grafana_net

  nginx:
    image: nginx:stable
    container_name: grafana-nginx
    depends_on:
      - grafana
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - grafana_net

  certbot:
    image: certbot/certbot:latest
    container_name: grafana-certbot
    profiles:
      - certbot
    ports:
      - "80:80"
    volumes:
      - certbot-www:/var/www/certbot
      - certs:/etc/letsencrypt
    networks:
      - grafana_net

volumes:
  grafana-data:
  loki-data:
  certbot-www:
  certs:

networks:
  grafana_net:
