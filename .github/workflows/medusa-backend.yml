name: Build and Deploy Medusa Backend

on:
  push:
    branches:
      - main
      - feature/medusa-image-workflow
    paths:
      - "my-medusa-store/**"
      - ".github/workflows/medusa-backend.yml"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/alphasearchinc/my-medusa-store

jobs:
  build-and-push:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./my-medusa-store
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/medusa-image-workflow'

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MEDUSA_VM_HOST }}
          username: ${{ secrets.MEDUSA_VM_USER }}
          key: ${{ secrets.MEDUSA_VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/medusa
            docker compose pull
            docker compose up -d
