---
# Where we deploy everything on the VM
medusa_project_root: /opt/medusa

# Docker image for your Medusa backend in GHCR
# TODO: replace with your real org/repo
medusa_image: "ghcr.io/alphasearchinc/my-medusa-store"
medusa_image_tag: "latest"

# Docker image for the Python embedder in GHCR
# TODO: replace with your real org/repo
embedder_image: "ghcr.io/alphasearchinc/python-embedder"
embedder_image_tag: "latest"

# Medusa port on the host
medusa_port: 9000

# Elasticsearch heap size
es_heap: "512m"

# NOTE: Placeholder only. Overridden by group_vars/secrets.yml (Ansible Vault).
medusa_database_url: "postgres://placeholder:placeholder@localhost:5432/postgres"
medusa_redis_url: "redis://redis:6379"
node_env: "production"

# CORS configuration for Medusa HTTP server
# Comma-separated list of allowed origins for the Store API.
store_cors: "https://ai-search-lime.vercel.app,https://dynasearch.dk"
# Comma-separated list of allowed origins for the Admin API.
admin_cors: "https://dynasearch.dk"
# Comma-separated list of allowed origins for Auth routes (if used).
auth_cors: "https://ai-search-lime.vercel.app,https://dynasearch.dk"

# HTTPS / reverse proxy
medusa_domain: "dynasearch.dk"
letsencrypt_email: "admin@dynasearch.dk"
medusa_tls_cert_path: "/etc/letsencrypt/live/{{ medusa_domain }}/fullchain.pem"
medusa_tls_key_path: "/etc/letsencrypt/live/{{ medusa_domain }}/privkey.pem"
enable_hsts: false
